services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook_user
      POSTGRES_PASSWORD: webhook_pass
      POSTGRES_DB: webhook_processor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook_user -d webhook_processor"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgres://webhook_user:webhook_pass@postgres:5432/webhook_processor
      MAX_ATTEMPTS: 5
      LEASE_DURATION_MS: 10000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10

  worker-1:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      WORKER_ID: worker-1
      DATABASE_URL: postgres://webhook_user:webhook_pass@postgres:5432/webhook_processor
      MAX_ATTEMPTS: 5
      LEASE_DURATION_MS: 10000
      POLL_INTERVAL_MS: 250
      BASE_BACKOFF_MS: 500
      MAX_BACKOFF_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  worker-2:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      WORKER_ID: worker-2
      DATABASE_URL: postgres://webhook_user:webhook_pass@postgres:5432/webhook_processor
      MAX_ATTEMPTS: 5
      LEASE_DURATION_MS: 10000
      POLL_INTERVAL_MS: 250
      BASE_BACKOFF_MS: 500
      MAX_BACKOFF_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
